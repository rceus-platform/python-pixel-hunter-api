[project]
name = "python-pixel-hunter-api"
version = "0.1.0"
description = "HD image search API built with FastAPI"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "httpx==0.28.1",
    "requests==2.32.5",
    "cloudscraper==1.2.71",
    "selectolax==0.3.26",
    "selenium==4.34.2",
    "pillow==11.3.0",
    "pytest-asyncio>=0.23.5"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.2,<9.0.0",
    "pytest-asyncio>=0.23.5"
]

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "import-outside-toplevel",
    "unused-import",
    "no-member",
    "invalid-name",
    "self-assigning-variable",
    "protected-access",
]

[tool.isort]
known_first_party = ["app"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
